
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
<defs>
  <linearGradient id="bg" x2="1" y2="1">
    <stop stop-color="#050B18"/>
    <stop offset=".52" stop-color="#101C36"/>
    <stop offset="1" stop-color="#07101F"/>
  </linearGradient>
  <linearGradient id="earth" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#53D8FF"/>
    <stop offset=".5" stop-color="#1768C5"/>
    <stop offset="1" stop-color="#10264F"/>
  </linearGradient>
  <linearGradient id="accent">
    <stop stop-color="#35D5F5"/>
    <stop offset="1" stop-color="#657BFF"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop stop-color="#1679E8" stop-opacity=".28"/>
    <stop offset="1" stop-color="#1679E8" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="globe">
    <circle cx="185" cy="205" r="137"/>
  </clipPath>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#6D9CCB" stroke-opacity=".09"/>
  </pattern>
  <filter id="blur">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
</defs>

<!-- Background -->
<rect width="1600" height="400" fill="url(#bg)"/>
<rect width="1600" height="400" fill="url(#grid)"/>
<ellipse cx="190" cy="205" rx="230" ry="220" fill="url(#glow)"/>
<ellipse cx="1370" cy="205" rx="300" ry="220" fill="url(#glow)"/>

<!-- Earth / Space section -->
<g>
  <circle cx="185" cy="205" r="151" fill="none" stroke="#35D5F5" stroke-opacity=".22"/>
  <circle cx="185" cy="205" r="163" fill="none" stroke="#718BFF" stroke-opacity=".18" stroke-dasharray="3 10"/>
  <circle cx="185" cy="205" r="137" fill="url(#earth)"/>
  <g clip-path="url(#globe)" fill="none" stroke="#9CEBFF" stroke-opacity=".34">
    <ellipse cx="185" cy="205" rx="54" ry="137"/>
    <ellipse cx="185" cy="205" rx="105" ry="137"/>
    <ellipse cx="185" cy="205" rx="137" ry="48"/>
    <ellipse cx="185" cy="205" rx="137" ry="94"/>
    <path d="M40 205H330M185 65V345"/>
    <path d="M90 100L150 145L135 195L180 220L155 280L210 320"/>
  </g>
  <g clip-path="url(#globe)" fill="#A6E9F9" opacity=".78">
    <path d="M70 140L104 113L135 125L144 151L124 169L112 192L82 184L63 161Z"/>
    <path d="M155 95L194 78L220 102L212 129L232 149L210 178L184 164L163 142Z"/>
    <path d="M212 210L252 190L282 212L268 245L246 264L220 250Z"/>
    <path d="M115 225L142 208L159 232L151 273L128 289L105 263Z"/>
  </g>
  <circle cx="185" cy="205" r="137" fill="none" stroke="#76E4FF" stroke-width="2"/>
  <path d="M35 110Q180 -5 333 104" fill="none" stroke="#48DFFF" stroke-opacity=".6" stroke-width="1.5"/>
  <circle cx="333" cy="104" r="4" fill="#61E7FF"/>
  <circle cx="45" cy="305" r="3" fill="#61E7FF"/>
</g>

<!-- Space particles -->
<g fill="#A8E9FF">
  <circle cx="48" cy="70" r="2"/><circle cx="330" cy="52" r="2"/>
  <circle cx="355" cy="315" r="2"/><circle cx="75" cy="350" r="1.5"/>
  <circle cx="410" cy="95" r="2"/><circle cx="390" cy="350" r="1.5"/>
</g>

<!-- Center identity -->
<g font-family="Arial, Helvetica, sans-serif">
  <text x="470" y="105" font-size="15" letter-spacing="6" fill="#52D8F4">DATA ANALYTICS  /  SPACE &amp; TECHNOLOGY</text>
  <text x="465" y="187" font-size="57" font-weight="700" letter-spacing="-1.5" fill="#F4F8FF">Kariman Muhammad</text>
  <rect x="470" y="215" width="62" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="470" y="259" font-size="22" letter-spacing="4" fill="#65DDF7">JUNIOR DATA ANALYST</text>
  <text x="470" y="302" font-size="16" letter-spacing="1" fill="#9BAFCB">Exploring data. Discovering insights.</text>
  <text x="470" y="350" font-size="12" letter-spacing="3" fill="#627A9B">PYTHON  •  SQL  •  POWER BI  •  EXCEL</text>
</g>

