    <circle cx="127" cy="118" r="3"/><circle cx="164" cy="72" r="3"/>
    <circle cx="201" cy="84" r="3"/><circle cx="250" cy="57" r="3"/>
  </g>
  <circle cx="294" cy="139" r="39" fill="none" stroke="#283F66" stroke-width="11"/>
  <circle cx="294" cy="139" r="39" fill="none" stroke="#43D6EF" stroke-width="11" stroke-dasharray="155 245" transform="rotate(-90 294 139)" stroke-linecap="round"/>
  <text x="294" y="143" text-anchor="middle" font-family="Arial" font-size="17" fill="#F1FAFF">DATA</text>
  <text x="25" y="237" font-family="Arial" font-size="10" letter-spacing="2" fill="#7C94B5">ANALYZE  •  VISUALIZE  •  INSIGHT</text>
